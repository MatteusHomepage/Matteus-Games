<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030504" />
    <title>Game Hub</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2319d77b'/%3E%3Cpath d='M13 9.5v13l10-6.5z' fill='%2306100a'/%3E%3C/svg%3E"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap");
      :root {
        color-scheme: dark;
        --bg: #030504;
        --line: #151e18;
        --muted: #7f8b83;
        --text: #f3f7f4;
        --accent: #19d77b;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: inherit;
        text-decoration: none;
      }


      .spot {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .spot::before,
      .spot::after {
        content: "";
        position: absolute;
        inset: 0;
        clip-path: polygon(36% 0, 64% 0, 76% 100%, 24% 100%);
      }
      .spot::before {
        background: linear-gradient(
          180deg,
          #0f1812 0%,
          #0a110d 55%,
          #070c09 100%
        );
      }
      .spot::after {
        background: radial-gradient(
          ellipse at 50% 0%,
          rgba(25, 215, 123, 0.1),
          transparent 62%
        );
        animation: breathe 7s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @media (max-width: 700px) {
        .spot::before,
        .spot::after {
          clip-path: polygon(18% 0, 82% 0, 88% 100%, 12% 100%);
        }
      }

      .topbar {
        height: calc(68px + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 16px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: sticky;
        top: 0;
        z-index: 6;
        background: linear-gradient(#030504d9, #03050400);
        flex: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-family: "Outfit", sans-serif;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.45px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: #06100a;
      }
      .brand-mark svg {
        width: 19px;
        height: 19px;
      }
      @media (max-width: 560px) {
        .brand .brand-text {
          display: none;
        }
      }

      main {
        position: relative;
        z-index: 1;
        width: min(940px, calc(100% - 32px));
        margin: 0 auto;
        padding: 26px 0 40px;
        flex: 1;
      }
      .hero {
        text-align: center;
        margin: 18px auto 34px;
        max-width: 650px;
        animation: rise 0.6s var(--ease) both;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .hero h1 {
        font:
          700 clamp(34px, 6vw, 54px) / 1.04 "Outfit",
          sans-serif;
        letter-spacing: -1.8px;
        margin: 10px 0;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 340px));
        justify-content: center;
        gap: 12px;
      }
      .game-card {
        min-height: 200px;
        padding: 20px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(145deg, #0b120e, #070b09);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        transition:
          transform 0.2s,
          border-color 0.2s,
          background 0.2s,
          box-shadow 0.25s;
        animation: rise 0.6s calc(0.12s + var(--i, 0) * 0.08s) var(--ease) both;
      }
      .game-card:hover,
      .game-card:focus-visible {
        transform: translateY(-4px);
        border-color: #19d77b66;
        background: linear-gradient(145deg, #0f1b14, #080d0a);
        box-shadow: 0 14px 40px #19d77b12;
        outline: none;
      }
      .game-card:active {
        transform: scale(0.98);
      }
      .game-icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        background: #19d77b16;
        color: var(--accent);
        display: grid;
        place-items: center;
        margin-bottom: 27px;
      }
      .game-icon svg {
        width: 23px;
        height: 23px;
      }
      .game-card h2 {
        font:
          600 21px "Outfit",
          sans-serif;
        margin: 0 0 8px;
      }
      .game-card p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
        margin: 0;
      }
      .game-bottom {
        margin-top: auto;
        padding-top: 22px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .game-tag {
        color: #5f6c64;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 10px;
      }

      .foot {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 14px 0 max(24px, env(safe-area-inset-bottom));
        font-size: 12px;
        color: #4f5c54;
        letter-spacing: 0.4px;
        flex: none;
      }


      #intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #020403;
        display: grid;
        place-items: center;
        transition:
          opacity 0.4s ease,
          visibility 0.4s;
      }
      #intro.out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .intro-in {
        position: relative;
        text-align: center;
        padding: 0 16px;
      }
      .intro-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 480px;
        height: 480px;
        margin: -240px 0 0 -240px;
        background: radial-gradient(circle, #19d77b14, transparent 65%);
        animation: fade 0.8s ease-out both;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .intro-by {
        position: relative;
        font:
          700 11px "DM Sans",
          sans-serif;
        letter-spacing: 6px;
        color: #6fbf93;
        margin-bottom: 12px;
        opacity: 0;
        animation: fade 0.5s 0.05s ease-out forwards;
      }
      .intro-name {
        position: relative;
        display: inline-block;
        font:
          800 clamp(34px, 9vw, 62px) "Outfit",
          sans-serif;
        letter-spacing: -1px;
        white-space: nowrap;
        padding: 4px 8px;
      }
      .intro-name span {
        display: inline-block;
        opacity: 0;
        transform: translateY(8px);
        animation: iletter 0.45s calc(0.1s + var(--i) * 24ms) ease-out forwards;
      }
      @keyframes iletter {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .intro-line {
        position: relative;
        height: 2px;
        width: 0;
        margin: 12px auto 0;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          #0ecb70,
          #9bf7c6,
          #0ecb70,
          transparent
        );
        animation: iline 0.6s 0.3s ease-out forwards;
      }
      @keyframes iline {
        to {
          width: 70%;
        }
      }

      @media (max-width: 420px) {
        main {
          width: calc(100% - 24px);
          padding-top: 18px;
        }
        .games {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        #intro {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="spot"></div>
    <div id="intro">
      <div class="intro-in">
        <div class="intro-glow"></div>
        <div class="intro-by">MADE BY</div>
        <div class="intro-name" id="introName"></div>
        <div class="intro-line"></div>
      </div>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"
          ><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z" /></svg
        ></span>
        <span class="brand-text">GAME HUB</span>
      </div>
    </header>

    <main>
      <div class="hero">
        <div class="eyebrow">GAME HUB</div>
        <h1>Pick a game.</h1>
      </div>
      <div class="games" id="games"></div>
    </main>

    <footer class="foot">Made by Matteus Aydin 2026</footer>

    <script>
 
      const GAMES = [
        {
          title: "Song Guesser",
          desc: "Hear a short clip, guess the song. Play solo or battle a friend in a live 1v1 duel.",
          url: "song-guesser.html",
          tag: "Music",
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" /></svg>',
        },
       
      ];

      const grid = document.getElementById("games");
      GAMES.forEach((g, i) => {
        const a = document.createElement("a");
        a.className = "game-card";
        a.href = g.url;
        a.style.setProperty("--i", i);
        const icon = document.createElement("span");
        icon.className = "game-icon";
        icon.innerHTML = g.icon || "";
        const h = document.createElement("h2");
        h.textContent = g.title;
        const p = document.createElement("p");
        p.textContent = g.desc;
        const bottom = document.createElement("span");
        bottom.className = "game-bottom";
        const play = document.createElement("span");
        play.textContent = "PLAY →";
        const tag = document.createElement("span");
        tag.className = "game-tag";
        tag.textContent = g.tag || "";
        bottom.append(play, tag);
        a.append(icon, h, p, bottom);
        grid.appendChild(a);
      });


      (function intro() {
        const el = document.getElementById("intro"),
          nm = document.getElementById("introName"),
          name = "Matteus Aydin";
        [...name].forEach((ch, i) => {
          const s = document.createElement("span");
          s.textContent = ch;
          s.style.setProperty("--i", i);
          s.style.color = `color-mix(in srgb, #0ecb70 ${100 - Math.round((i / (name.length - 1)) * 100)}%, #9bf7c6)`;
          nm.appendChild(s);
        });
        setTimeout(() => el.classList.add("out"), 1000);
        setTimeout(() => el.remove(), 1450);
      })();
    </script>
  </body>
</html>
